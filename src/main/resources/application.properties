spring.application.name=ms-report
server.port=${SERVER_PORT:8083}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=bd_report
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.default-schema=bd_report
spring.flyway.schemas=bd_report
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:bd-report-v1}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=20
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.consumer.properties.group.protocol=classic
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=${KAFKA_CONCURRENCY:3}
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_ENABLED:true}
spring.kafka.listener.missing-topics-fatal=true
spring.kafka.admin.auto-create=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}

report.events-topic=${KAFKA_EVENTS_TOPIC:bd.requests.events.v1}
report.analytics-topic=${KAFKA_ANALYTICS_TOPIC:bd.requests.analytics.v1}
report.consumer-retries=${KAFKA_CONSUMER_RETRIES:2}
report.retry-delay-ms=${KAFKA_RETRY_DELAY_MS:1000}
report.outbox.enabled=${OUTBOX_ENABLED:true}
report.outbox.delay-ms=${OUTBOX_DELAY_MS:1000}
report.outbox.batch-size=${OUTBOX_BATCH_SIZE:10}
report.outbox.send-timeout-ms=${OUTBOX_SEND_TIMEOUT_MS:20000}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
logging.structured.format.console=logstash
